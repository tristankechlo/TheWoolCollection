modLoader = "javafml"
loaderVersion = "${forge_loader_range}"
license = "CC BY-NC-ND 4.0"
showAsResourcePack = false

[[mods]]
    modId = "wool_collection"
    version = "${version}"
    displayName = "The Wool Collection"
    displayURL = "https://www.curseforge.com/minecraft/mc-mods/wool-collection"
    logoFile = "pack.png"
    #credits=""
    authors = "Buecher_wurm"
    description = '''Adds wool variants for various blocks, like fences, stairs, gates, buttons and more!'''

[[dependencies.wool_collection]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_loader_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.wool_collection]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${version_range}"
    ordering = "NONE"
    side = "BOTH"
